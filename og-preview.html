<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #FAFAF8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .canvas {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }

  .name {
    font-size: 78px;
    font-weight: 700;
    color: #1a1d21;
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 32px;
  }

  .rule {
    width: 120px;
    height: 4px;
    background: #1a3d7c;
    margin-bottom: 32px;
  }

  .line1 {
    font-size: 30px;
    font-weight: 500;
    color: #6b7280;
    margin-bottom: 14px;
  }

  .line2 {
    font-size: 22px;
    font-weight: 400;
    color: #8a9099;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="name">GOWTHAMRAJ A</div>
    <div class="rule"></div>
    <div class="line1">Product &middot; Strategy &middot; BFSI</div>
    <div class="line2">IIM Bangalore MBA &middot; CFA Level I &middot; Bengaluru</div>
  </div>
</body>
</html>
